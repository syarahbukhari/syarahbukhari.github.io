# Konfigurasi panel admin (Sveltia CMS).
# Setiap simpanan di panel admin akan dicommit ke GitHub dan laman akan dibina semula secara automatik.
backend:
  name: github
  repo: syarahbukhari/syarahbukhari.github.io
  branch: main

locale: en
media_folder: uploads
public_folder: /uploads

collections:
  - name: kitab
    label: Kitab
    label_singular: Kitab
    description: "Setiap Kitab (tajuk besar) mengandungi senarai ebook. Tambah ebook baharu dengan membuka Kitab berkenaan dan tekan 'Add Ebook' di bahagian Senarai Ebook."
    folder: content/kitab
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: tajuk
    slug: "{{slug}}"
    summary: "{{urutan}}. {{tajuk}}"
    sortable_fields: [urutan, tajuk]
    fields:
      - name: urutan
        label: "No. urutan kitab"
        widget: number
        value_type: int
        min: 1
        hint: "Menentukan susunan kitab di laman utama (1 = paling atas)."
      - name: tajuk
        label: "Tajuk kitab"
        widget: string
        hint: "Contoh: Kitab Wahyu. Alamat URL kitab dijana daripada tajuk semasa kitab mula dicipta."
      - name: tajuk_arab
        label: "Tajuk dalam Bahasa Arab"
        widget: string
        required: false
      - name: penerangan
        label: "Penerangan ringkas kitab"
        widget: text
        required: false
      - name: kuliah_url
        label: "Pautan kuliah YouTube kitab ini (pilihan)"
        widget: string
        required: false
        hint: "Pautan saluran atau playlist rakaman kuliah Maulana Asri untuk kitab ini. Dipaparkan sebelum bahagian infaq."
      - name: kuliah_label
        label: "Teks pautan kuliah (pilihan)"
        widget: string
        required: false
        hint: "Jika kosong: 'Kuliah <tajuk kitab>'"
      - name: ebooks
        label: "Senarai Ebook"
        label_singular: Ebook
        widget: list
        collapsed: true
        summary: "{{fields.tajuk}}"
        hint: "Susunan di sini = susunan di laman. Seret untuk ubah susunan."
        fields:
          - name: tajuk
            label: "Tajuk ebook"
            widget: string
            hint: "Contoh: Muqaddimah, Hadis Pertama, Hadis Kelima. Jangan ubah selepas dikongsi kerana alamat URL dijana daripada tajuk."
          - name: subtajuk
            label: "Tema / subtajuk"
            widget: string
            required: false
            hint: "Contoh: Amalan Bergantung kepada Niat"
          - name: ringkasan
            label: "Ringkasan pendek"
            widget: text
            required: false
          - name: pdf
            label: "Fail PDF ebook"
            widget: file
            required: false
            hint: "Muat naik fail PDF. Jika kosong, laman akan papar 'Ebook akan dimuat naik'."
          - name: youtube
            label: "Pautan video YouTube"
            widget: string
            required: false
            hint: "Tampal pautan penuh, contoh: https://youtu.be/xxxxxxxxxxx. Jika kosong, laman akan papar 'Video akan datang'."
          - name: kulit
            label: "Gambar kulit ebook (pilihan)"
            widget: image
            required: false
          - name: terbit
            label: "Paparkan di laman"
            widget: boolean
            default: true
            required: false
            hint: "Matikan untuk sembunyikan sementara (draf)."

  - name: tetapan
    label: Tetapan Laman
    files:
      - name: umum
        label: Tetapan Umum
        file: content/tetapan.json
        format: json
        fields:
          - { name: nama_laman, label: "Nama laman", widget: string }
          - { name: slogan, label: "Slogan (di bawah nama)", widget: text }
          - { name: pengenalan, label: "Teks pengenalan (laman utama)", widget: text }
          - { name: kredit, label: "Kredit / penerbit", widget: string }
          - { name: hubungi, label: "Emel atau pautan untuk dihubungi (pilihan)", widget: string, required: false }
          - name: kuliah
            label: "Bahagian Kuliah (sebelum Infaq)"
            widget: object
            collapsed: true
            hint: "Pautan kuliah ditetapkan pada setiap Kitab."
            fields:
              - { name: aktif, label: "Paparkan bahagian kuliah", widget: boolean, default: true }
              - { name: tajuk, label: "Tajuk", widget: string }
              - { name: teks, label: "Teks", widget: text, required: false }
          - name: infaq
            label: "Bahagian Infaq (di bawah setiap halaman)"
            widget: object
            collapsed: false
            fields:
              - { name: aktif, label: "Paparkan bahagian infaq", widget: boolean, default: true }
              - { name: tajuk, label: "Tajuk", widget: string }
              - { name: teks, label: "Teks ajakan", widget: text, required: false }
              - { name: qr, label: "Gambar kod QR", widget: image, required: false }
              - { name: bank, label: "Nama bank", widget: string, required: false }
              - { name: nama_akaun, label: "Nama pemegang akaun", widget: string, required: false }
              - { name: no_akaun, label: "No. akaun", widget: string, required: false }
              - { name: rujukan, label: "Rujukan bayaran", widget: string, required: false }
              - { name: pautan, label: "Pautan infaq online (contoh ToyyibPay)", widget: string, required: false }
              - { name: pautan_label, label: "Teks butang pautan", widget: string, required: false }
              - { name: peringatan_aktif, label: "Papar peringatan infaq (kotak kecil di bawah skrin)", widget: boolean, default: true, required: false }
              - { name: peringatan_tajuk, label: "Peringatan: tajuk", widget: string, required: false }
              - { name: peringatan_teks, label: "Peringatan: teks", widget: text, required: false }
              - { name: peringatan_saat, label: "Peringatan: muncul selepas berapa saat", widget: number, value_type: int, min: 0, default: 15, required: false }
              - { name: peringatan_hari, label: "Peringatan: selepas ditutup, jangan papar semula selama berapa hari", widget: number, value_type: int, min: 1, default: 3, required: false }
